<svg xmlns="http://www.w3.org/2000/svg" width="60.96mm" height="128.5mm" viewBox="0 0 60.96 128.5">
  <!-- Intentionally blank. PanelChrome (in BmboBTFQuantizer.cpp) draws the
       actual background, border, dividers, and labels at runtime so the
